[package]
name = "ferrumc-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Shared identity/error types: `PlayerId` keys the player<->shard mapping and
# `ServerError` is the classifying root that `SessionError` converts into.
ferrumc-core = { workspace = true }
# Typed coordinates: `Vec3` carries player positions, and `ShardPos`/`BlockPos`/
# `ChunkPos` implement the position->shard routing policy (never raw tuples).
ferrumc-math = { workspace = true }
# `write_var_int` hand-encodes the variable per-action entry list of the
# clientbound Player Info Update "Add Player" body (count + name length + property
# count), which the typed grammar carries as opaque `remaining_bytes`.
ferrumc-codec = { workspace = true }
# Source of the network-side play vocabulary this crate bridges: `DisconnectReason`
# classifies why a connection ended (carried by `NetEvent::Disconnected`).
ferrumc-net = { workspace = true }
# The typed packet enums: serverbound play packets translate into sim inputs and
# clientbound play packets are the outbound shells sim outputs translate into.
ferrumc-proto = { workspace = true }
# Builds the network-form (anonymous-root) NBT `NbtTag` that the clientbound
# `SystemChat` packet carries: the `TextComponent` -> NBT encoder lives here
# because this is the only crate that depends on both `ferrumc-core` (owns
# `TextComponent`) and `ferrumc-proto` (owns `SystemChat`). `ferrumc-proto` does
# not depend on `ferrumc-core`, so the encoder cannot live there.
ferrumc-nbt = { workspace = true }
# The simulation boundary messages: `GameInput` flows to shard inboxes and
# `GameOutput` flows back out. The router never touches a raw `SimShard`.
ferrumc-sim = { workspace = true }
# Bounded `mpsc` channels are the only transport between the router and shards /
# connections. Only `tokio::sync::mpsc` is used here (the workspace pins "full").
tokio = { workspace = true }
# `SessionError` is a thiserror enum so each failure mode is a classified variant
# with a derived `Display`, per the library error-handling rule.
thiserror = { workspace = true }
# A 128-bit `uuid::Uuid` is needed in two places: boss-bar packets are keyed by
# one (the scoreboard builders accept it and forward it to the typed `BossBar`
# head), and a non-player entity's clientbound `SpawnEntity` packet carries one
# (unlike a player there is no `PlayerId` to source it from, so the router mints
# a deterministic id from the entity's network id).
uuid = { workspace = true }

[dev-dependencies]
# Drive the one async `recv` test on a minimal current-thread runtime; all other
# tests are runtime-free (bounded-channel `try_send`/`try_recv` need no runtime).
tokio = { workspace = true }
# The strict golden-byte frame oracle (`assert_wire_frame`) pins the hand-encoded
# `SoundEffect` and `Particle` payloads byte-for-byte and proves they round-trip
# through the generated codecs. Test-only; `ferrumc-testkit` does not depend on
# this crate, so the dev edge stays acyclic.
ferrumc-testkit = { workspace = true }

[lints]
workspace = true
